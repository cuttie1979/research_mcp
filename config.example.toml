# research_mcp configuration
# Copy this file to `config.toml` (next to the binary or in the project dir)
# and fill in your OpenCode Go API key. config.toml is gitignored — the key
# stays local. The final key will be set by you.

# OpenCode Go API key (required). Get it from https://opencode.ai/auth
api_key = ""            # e.g. "sk-..."

# Elsevier API key (ScienceDirect/Scopus). Get it from https://dev.elsevier.com/apikey/manage
# elsevier_api_key = ""

# OpenCode Go model ID
model = "deepseek-v4-flash"

# LLM API base URL (default: OpenCode Go)
# llm_base_url = "https://opencode.ai/zen/go/v1"

# Max source pages to fetch during research
# max_sources = 8

# Output directory for <slug>.md + <slug>.provenance.md
# out_dir = "/home/user/AIDocumentStore/raw/research"

# SQLite database path (research queue + session state)
# db_path = "/home/user/AIHome/research_mcp/research.db"

# LLM temperature for drafting
# temperature = 0.3

# LLM request timeout in seconds (0 = no timeout)
# llm_timeout_secs = 120
