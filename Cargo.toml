[package]
name = "research_mcp"
version = "0.1.0"
edition = "2024"
description = "Rust deepresearch tool — Feynman deepresearch port with OpenCode Go LLM + DuckDuckGo search"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
toml = "0.8"
quick-xml = "0.37"
rusqlite = { version = "0.32", features = ["bundled"] }
rmcp = { version = "3.1", features = ["server", "transport-io"] }
rmcp-macros = "3.1"
uuid = { version = "1", features = ["v4"] }
